name: Build MV CHOIR LAB V2.01

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Show VST3 files
        shell: pwsh
        run: |
          Write-Host "=== VST3 files ==="
          Get-ChildItem -Path "build" -Recurse -Filter "*.vst3" |
            Select-Object FullName

      - name: Show build directories
        shell: pwsh
        run: |
          Write-Host "=== Build directories ==="
          Get-ChildItem -Path "build" -Recurse -Directory |
            Select-Object FullName

      - name: Prepare artifact
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem `
            -Path "build" `
            -Recurse `
            -Directory `
            -Filter "*.vst3" |
            Where-Object {
              $_.FullName -like "*Release*VST3*"
            } |
            Select-Object -First 1

          if (-not $vst3) {
            Write-Error "No VST3 bundle found."
            exit 1
          }

          Write-Host "Found VST3:"
          Write-Host $vst3.FullName

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          Copy-Item `
            -Path $vst3.FullName `
            -Destination "dist" `
            -Recurse `
            -Force

          Write-Host "=== Artifact contents ==="
          Get-ChildItem "dist" -Recurse |
            Select-Object FullName

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MV-CHOIR-LAB-VST3
          path: dist
          if-no-files-found: error
